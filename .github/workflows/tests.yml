name: tests
on: [push, pull_request]
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 tools/build_deploy.py && git diff --exit-code contracts
      - run: python3 -m unittest discover -s tests -v
